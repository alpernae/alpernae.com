{{ define "main" }}
<article>
  <div class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <span><span class="prompt">$</span> {{ .Date.Format "2006-01-02" }}</span>
      <span>·</span>
      <span>{{ .ReadingTime }} min read</span>
      {{ if .Params.tags }}
      <span>·</span>
      <div class="post-tags">
        {{ range .Params.tags }}
        <span class="post-tag {{ . }}">{{ . }}</span>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </div>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
